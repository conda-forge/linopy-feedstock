schema_version: 1

context:
  name: linopy
  version: "0.10.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/linopy-${{ version }}.tar.gz
  sha256: 1d08a2e56205c7d536a1fa277a9515045ca81bfacb3f72e2b3950c4ada92f8d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
    - setuptools-scm >=8.0
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - bottleneck
    - toolz
    - numexpr
    - xarray >=2024.2.0
    - dask-core >=0.18.0
    - polars >=1.31.1
    - tqdm
    - deprecation
    - packaging
tests:
  - python:
      imports:
        - linopy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Linear optimization with N-D labeled arrays in Python
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/PyPSA/linopy
  repository: https://github.com/PyPSA/linopy
  documentation: https://github.com/PyPSA/linopy/blob/master/README.md

extra:
  recipe-maintainers:
    - fabianhofmann
    - fneum
    - xylar
    - lkstrp
